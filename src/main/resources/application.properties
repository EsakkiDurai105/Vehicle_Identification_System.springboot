spring.application.name=vehicle-identification-system

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/vehicledb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8085

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# Admin Authentication
app.auth.admin.username=admin
app.auth.admin.password=admin123

# Authentication
app.auth.admin.username=admin
app.auth.admin.password=admin123

app.auth.user.username=user
app.auth.user.password=user123